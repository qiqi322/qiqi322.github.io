<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人导航</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 300px;
        }
        h1 { color: #333; margin-bottom: 30px; }
        .btn {
            display: block;
            width: 100%;
            padding: 15px 0;
            margin: 10px 0;
            text-decoration: none;
            color: white;
            border-radius: 8px;
            transition: transform 0.2s;
            font-weight: bold;
        }
        .btn:hover { transform: scale(1.05); }
        
        /* 颜色定义 */
        .baidu { background-color: #2932e1; } /* 百度蓝 */
        .bilibili { background-color: #fb7299; } /* B站粉 */
        .deepseek { background-color: #4d6bfe; } /* DeepSeek 类似色 */

    </style>
</head>
<body>

<div class="container">
    <h1>我的导航</h1>
    
    <!-- 百度 -->
    <a href="https://www.baidu.com" target="_blank" class="btn baidu">
        百度一下
    </a>

    <!-- Bilibili -->
    <a href="https://www.bilibili.com" target="_blank" class="btn bilibili">
        哔哩哔哩
    </a>

    <!-- DeepSeek (新增) -->
    <a href="https://chat.deepseek.com" target="_blank" class="btn deepseek">
        DeepSeek AI
    </a>
</div>

</body>
</html>
